<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<!-- Skytrace, team Skytrace, NASA Space Apps Challenge 2026 ("Planet X and SPHEREx"). Welcome page. -->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skytrace</title>
<meta name="description" content="Skytrace: blink NASA SPHEREx's infrared sky and find what moves.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<script>
  // Links made before the welcome page existed pointed at "/?field=…", "/?ra=…" or a shared folder: go straight to the dashboard.
  if (/[?&](field|ra|dec|embed|folder)=/.test(location.search)) location.replace('app.html' + location.search + location.hash);
</script>
<style>
  html, body { margin: 0; height: 100%; background: #02040a; overflow: hidden; font-family: "Rajdhani", system-ui, sans-serif; }
  #bg, #stars { position: fixed; inset: 0; width: 100%; height: 100%; }
  #bg { background: #02040a center / cover no-repeat; opacity: 0; transition: opacity 1.2s ease; }
  #bg.on { opacity: 1; }
  #shade { position: fixed; inset: 0; background: radial-gradient(ellipse at center, rgba(2, 4, 10, .15) 0%, rgba(2, 4, 10, .55) 70%, rgba(2, 4, 10, .85) 100%); }
  .stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  .logo { position: relative; width: min(86vw, 1150px, calc((100vh - 140px) * 2.115)); aspect-ratio: 406 / 192; }
  .logo img, .logo canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .logo img { opacity: 0; transition: opacity 1.4s ease; filter: drop-shadow(0 0 18px rgba(120, 200, 255, .25)); }
  .logo img.on { opacity: 1; }
  .next { position: fixed; left: 50%; bottom: 7vh; transform: translateX(-50%); opacity: 0; pointer-events: none; transition: opacity .8s ease;
    font: 700 1rem/1 "Rajdhani", system-ui, sans-serif; letter-spacing: .25em; text-transform: uppercase; color: #02121a; background: #40e0d0;
    border: 0; padding: .9rem 2.4rem; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); cursor: pointer; text-decoration: none; }
  .next.on { opacity: 1; pointer-events: auto; }
  .next:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
  .skip { position: fixed; top: 1rem; right: 1.2rem; color: rgba(220, 235, 245, .7); font: 600 .85rem system-ui, sans-serif; text-decoration: none; letter-spacing: .05em; }
  .skip:hover { color: #fff; }
  .credit { position: fixed; left: 1rem; bottom: .7rem; color: rgba(200, 215, 230, .55); font: .72rem system-ui, sans-serif; max-width: 60vw; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<canvas id="stars" aria-hidden="true"></canvas>
<div id="shade" aria-hidden="true"></div>
<a class="skip" href="home.html">Skip intro</a>
<main class="stage">
  <h1 class="sr-only">Skytrace</h1>
  <div class="logo" id="logo">
    <img id="logoImg" src="assets/logo-nostar@2x.png" alt="Skytrace">
    <canvas id="fx" aria-hidden="true"></canvas>
  </div>
</main>
<a class="next" id="next" href="home.html">Next</a>
<div class="credit" id="credit"></div>

<script>
(function () {
  'use strict';
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  // ---- background: a photograph if one is supplied (assets/welcome-bg.jpg + its credit), otherwise drawn stars and galaxies
  const BG = 'assets/welcome-bg.jpg', BG_CREDIT = (window.SKYTRACE_BG_CREDIT || '');
  const probe = new Image();
  probe.onload = () => { document.getElementById('bg').style.backgroundImage = `url(${BG})`; document.getElementById('bg').classList.add('on'); document.getElementById('stars').style.opacity = '.35'; document.getElementById('credit').textContent = BG_CREDIT; };
  probe.src = BG;
  const sc = document.getElementById('stars'), sg = sc.getContext('2d');
  function drawSky() {
    const dpr = Math.min(2, devicePixelRatio || 1), W = innerWidth, H = innerHeight; sc.width = W * dpr; sc.height = H * dpr; sg.setTransform(dpr, 0, 0, dpr, 0, 0);
    let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    const grd = sg.createRadialGradient(W * .5, H * .5, 0, W * .5, H * .5, Math.max(W, H) * .7); grd.addColorStop(0, '#0b1730'); grd.addColorStop(1, '#02040a'); sg.fillStyle = grd; sg.fillRect(0, 0, W, H);
    // faint galaxies: soft tilted ellipses
    for (let k = 0; k < 7; k++) {
      const x = rnd() * W, y = rnd() * H, r = 18 + rnd() * 60, a = rnd() * Math.PI, hue = [210, 30, 280][k % 3];
      sg.save(); sg.translate(x, y); sg.rotate(a); sg.scale(1, .35 + rnd() * .3);
      const g = sg.createRadialGradient(0, 0, 0, 0, 0, r); g.addColorStop(0, `hsla(${hue},70%,85%,.35)`); g.addColorStop(.35, `hsla(${hue},60%,60%,.12)`); g.addColorStop(1, 'rgba(0,0,0,0)');
      sg.fillStyle = g; sg.beginPath(); sg.arc(0, 0, r, 0, 2 * Math.PI); sg.fill(); sg.restore();
    }
    for (let k = 0; k < (W * H) / 1800; k++) {
      const x = rnd() * W, y = rnd() * H, m = Math.pow(rnd(), 3), r = .3 + m * 1.6;
      sg.fillStyle = `rgba(${215 + 40 * rnd()},${225 + 30 * rnd()},255,${.35 + .65 * m})`; sg.beginPath(); sg.arc(x, y, r, 0, 2 * Math.PI); sg.fill();
    }
  }
  drawSky(); addEventListener('resize', () => { drawSky(); drawFinal(); });

  // ---- logo geometry, in the logo image's own pixels (406 x 192): the outer ring of the logo is close to an ellipse
  // centred (202, 97), semi-axes 207 x 40, tilted -19 degrees; the yellow star sits at (189.5, 31.5)
  const LW = 406, LH = 192, E = { cx: 202, cy: 97, a: 207, b: 40, rot: -19 * Math.PI / 180 }, STAR = { x: 189.5, y: 31.5, r: 12.5 };
  const fx = document.getElementById('fx'), g = fx.getContext('2d'), logo = document.getElementById('logo'), img = document.getElementById('logoImg');
  let k = 1;
  function size() { const r = logo.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1); fx.width = r.width * dpr; fx.height = r.height * dpr; k = fx.width / LW; }
  const P = (t) => [E.cx + E.a * Math.cos(t) * Math.cos(E.rot) - E.b * Math.sin(t) * Math.sin(E.rot), E.cy + E.a * Math.cos(t) * Math.sin(E.rot) + E.b * Math.sin(t) * Math.cos(E.rot)];
  // where the upper arc passes under the star
  let tStar = 4.65; { let best = 1e9; for (let t = 3.4; t < 6.2; t += 0.001) { const [x] = P(t); if (Math.abs(x - STAR.x) < best) { best = Math.abs(x - STAR.x); tStar = t; } } }
  const T0 = Math.PI + 0.35, T1 = tStar - 2 * Math.PI;      // bottom arc from the lower left, round the right end, back along the top
  function star(x, y, r, alpha) {
    g.save(); g.translate(x * k, y * k); g.globalAlpha = alpha;
    const R = r * k, w = R * .22;
    const glow = g.createRadialGradient(0, 0, 0, 0, 0, R * 1.6); glow.addColorStop(0, 'rgba(255,240,120,.55)'); glow.addColorStop(1, 'rgba(255,240,120,0)');
    g.fillStyle = glow; g.beginPath(); g.arc(0, 0, R * 1.6, 0, 2 * Math.PI); g.fill();
    g.fillStyle = '#f4ee1c'; g.beginPath(); g.moveTo(0, -R); g.quadraticCurveTo(w, -w, R, 0); g.quadraticCurveTo(w, w, 0, R); g.quadraticCurveTo(-w, w, -R, 0); g.quadraticCurveTo(-w, -w, 0, -R); g.fill();
    g.restore();
  }
  function rocket(x, y, ang, s, flame) {
    g.save(); g.translate(x * k, y * k); g.rotate(ang); g.scale(s * k / 2, s * k / 2);
    if (flame > 0) { const fl = g.createLinearGradient(-14, 0, -4, 0); fl.addColorStop(0, 'rgba(255,120,30,0)'); fl.addColorStop(1, 'rgba(255,200,80,.95)');
      g.fillStyle = fl; g.beginPath(); g.moveTo(-4, -2.2); g.lineTo(-6 - 8 * flame, 0); g.lineTo(-4, 2.2); g.closePath(); g.fill(); }
    g.fillStyle = '#e9f2f8'; g.beginPath(); g.moveTo(9, 0); g.quadraticCurveTo(5, -3.2, -4, -2.6); g.lineTo(-4, 2.6); g.quadraticCurveTo(5, 3.2, 9, 0); g.fill();
    g.fillStyle = '#40e0d0'; g.beginPath(); g.arc(3, 0, 1.1, 0, 2 * Math.PI); g.fill();
    g.fillStyle = '#9fb3c4'; g.beginPath(); g.moveTo(-1, -2.4); g.lineTo(-5, -5); g.lineTo(-4, -2.4); g.fill(); g.beginPath(); g.moveTo(-1, 2.4); g.lineTo(-5, 5); g.lineTo(-4, 2.4); g.fill();
    g.restore();
  }
  function drawFinal() { size(); g.clearRect(0, 0, fx.width, fx.height); star(STAR.x, STAR.y, STAR.r, 1); }
  function finish() { img.classList.add('on'); drawFinal(); setTimeout(() => document.getElementById('next').classList.add('on'), reduce ? 0 : 350); document.getElementById('next').focus({ preventScroll: true }); }
  if (reduce) { finish(); return; }

  size(); setTimeout(() => img.classList.add('on'), 250);
  const D_RING = 3300, D_RISE = 700, D_IN = 650, trail = []; let t0 = null;
  const ease = (u) => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
  function frame(now) {
    if (t0 === null) t0 = now; const el = now - t0; g.clearRect(0, 0, fx.width, fx.height);
    let x, y, ang, s = 1, flame = 1, starA = 0, done = false;
    if (el < D_RING) {
      const u = ease(el / D_RING), t = T0 + (T1 - T0) * u; [x, y] = P(t); const [x2, y2] = P(t - 0.01); ang = Math.atan2((y2 - y) * k, (x2 - x) * k);
    } else if (el < D_RING + D_RISE) {
      const u = ease((el - D_RING) / D_RISE), [xa, ya] = P(T1); x = xa + (STAR.x - xa) * u; y = ya + (STAR.y - ya) * u; ang = Math.atan2(STAR.y - ya, STAR.x - xa);
    } else if (el < D_RING + D_RISE + D_IN) {
      const u = (el - D_RING - D_RISE) / D_IN; x = STAR.x; y = STAR.y; ang = -Math.PI / 2; s = 1 - u; flame = 1 - u; starA = u;
    } else { done = true; }
    if (done) { finish(); return; }
    trail.push([x, y]); if (trail.length > 26) trail.shift();
    for (let i = 1; i < trail.length; i++) { g.strokeStyle = `rgba(255,190,90,${(i / trail.length) * .55})`; g.lineWidth = Math.max(1, 1.6 * k * (i / trail.length)); g.beginPath(); g.moveTo(trail[i - 1][0] * k, trail[i - 1][1] * k); g.lineTo(trail[i][0] * k, trail[i][1] * k); g.stroke(); }
    if (starA > 0) star(STAR.x, STAR.y, STAR.r * (0.4 + 0.6 * starA), starA);
    if (s > 0.02) rocket(x, y, ang, s, flame);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  addEventListener('keydown', (e) => { if (e.key === 'Enter' && document.getElementById('next').classList.contains('on')) location.href = 'home.html'; });
})();
</script>
</body>
</html>
